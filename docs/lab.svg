<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#8b949e"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#3fb950"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#58a6ff"/>
    </marker>
  </defs>

  <rect width="1200" height="630" fill="#0d1117"/>

  <!-- headline -->
  <text x="70" y="72" font-family="DejaVu Sans, sans-serif" font-size="31" font-weight="bold" fill="#e6edf3">Layer 2 gets you the frame. Layer 3 drops it.</text>
  <text x="70" y="104" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#8b949e">ARP poisoning + nat/PREROUTING REDIRECT  ·  10.0.0.0/24  ·  one bridge, three namespaces</text>

  <!-- L2 lies -->
  <line x1="600" y1="160" x2="165" y2="160" stroke="#8b949e" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <line x1="165" y1="160" x2="165" y2="200" stroke="#8b949e" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="382" y="150" font-family="DejaVu Sans Mono, monospace" font-size="13" fill="#8b949e" text-anchor="middle">ARP: 10.0.0.3 is at my MAC</text>

  <line x1="600" y1="160" x2="1035" y2="160" stroke="#8b949e" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <line x1="1035" y1="160" x2="1035" y2="200" stroke="#8b949e" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="817" y="150" font-family="DejaVu Sans Mono, monospace" font-size="13" fill="#8b949e" text-anchor="middle">ARP: 10.0.0.2 is at my MAC</text>

  <!-- nodes -->
  <rect x="70" y="200" width="190" height="90" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="165" y="237" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#e6edf3" text-anchor="middle">client</text>
  <text x="165" y="265" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#8b949e" text-anchor="middle">10.0.0.2</text>

  <rect x="505" y="200" width="190" height="90" rx="8" fill="#0f2417" stroke="#3fb950" stroke-width="2"/>
  <text x="600" y="237" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#3fb950" text-anchor="middle">attacker</text>
  <text x="600" y="265" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#7ee787" text-anchor="middle">10.0.0.1</text>

  <rect x="940" y="200" width="190" height="90" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="1035" y="237" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#e6edf3" text-anchor="middle">server</text>
  <text x="1035" y="265" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#8b949e" text-anchor="middle">10.0.0.3</text>

  <!-- data path -->
  <line x1="260" y1="290" x2="505" y2="290" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="382" y="315" font-family="DejaVu Sans Mono, monospace" font-size="13" fill="#58a6ff" text-anchor="middle">dst IP still 10.0.0.3</text>

  <line x1="695" y1="290" x2="940" y2="290" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="817" y="315" font-family="DejaVu Sans Mono, monospace" font-size="13" fill="#58a6ff" text-anchor="middle">relay</text>

  <!-- the punchline -->
  <line x1="600" y1="330" x2="600" y2="368" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <rect x="330" y="368" width="540" height="104" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="600" y="398" font-family="DejaVu Sans Mono, monospace" font-size="14" fill="#79c0ff" text-anchor="middle">iptables -t nat -A PREROUTING -j REDIRECT --to-ports 31337</text>
  <text x="600" y="426" font-family="DejaVu Sans, sans-serif" font-size="14" fill="#8b949e" text-anchor="middle">without it: transit traffic, accept() never fires</text>
  <text x="600" y="452" font-family="DejaVu Sans, sans-serif" font-size="14" fill="#8b949e" text-anchor="middle">with it: the packet lands on the local socket</text>

  <!-- legend -->
  <line x1="70" y1="520" x2="110" y2="520" stroke="#58a6ff" stroke-width="2"/>
  <text x="120" y="525" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#8b949e">data path</text>
  <line x1="230" y1="520" x2="270" y2="520" stroke="#8b949e" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="280" y="525" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#8b949e">repeated ARP reply — the cache heals, so poisoning is a loop</text>

  <!-- footer -->
  <text x="70" y="590" font-family="DejaVu Sans Mono, monospace" font-size="16" fill="#58a6ff">github.com/Misterz2008/arp-mitm-lab</text>
</svg>
